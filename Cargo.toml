[package]
name = "blitz-diff"
version = "0.2.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
confy = "2.0.0"
eframe = "0.34.3"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.33"
uuid = { version = "1.11", features = ["v4", "serde"] }
winreg = "0.55"
zip = "8.6.0"

[build-dependencies]
embed-resource = "3.0.9"
